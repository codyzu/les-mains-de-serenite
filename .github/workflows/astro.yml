name: Deploy Astro site

on:
  push:
    branches: ["**"]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install

      - name: Generate astro types
        run: pnpm astro sync

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Configure deployment
        id: deployment
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          branch_alias="$(
            printf '%s' "${BRANCH_NAME}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's/[^a-z0-9]/-/g'
          )"

          if [[ "${BRANCH_NAME}" == "main" ]]; then
            site_url="https://lesmainsdeserenite.fr"
          else
            site_url="https://${branch_alias}.lesmainsdeserenite.pages.dev"
          fi

          printf 'site_url=%s\n' "${site_url}" >> "${GITHUB_OUTPUT}"

      - name: Build
        env:
          PUBLIC_ENABLE_ANALYTICS: ${{ github.ref == 'refs/heads/main' && 'true' || '' }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
          SITE_URL: ${{ steps.deployment.outputs.site_url }}
        run: pnpm run build

      - name: Run Playwright smoke tests
        run: pnpm run test:smoke

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload Cloudflare Pages artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages
          path: dist

  deploy-github:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    if: github.ref != 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: cloudflare-pages
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=lesmainsdeserenite
            --branch=${{ github.ref_name }}
            --commit-hash=${{ github.sha }}
